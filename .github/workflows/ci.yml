name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
        env:
          SECRET_KEY: ci-test-secret-key

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST
        run: bandit -r app -f json -o reports/sast.bandit.json || [ $? -eq 1 ]

      - name: Check for high severity findings
        run: bandit -r app --severity-level high

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: sast.bandit.json
          path: reports/sast.bandit.json

  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt -f json -o reports/sca.pip-audit.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: sca.pip-audit.json
          path: reports/sca.pip-audit.json

      - name: Check dependencies for high or critical vulnerabilities
        run: |
          mkdir -p sca-input
          cp requirements.txt sca-input/requirements.txt
          docker run --rm \
            -v "$PWD/sca-input:/workdir" \
            aquasec/trivy:0.74.0 fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output /workdir/sca.trivy.json \
            /workdir

      - name: Upload Trivy SCA report
        uses: actions/upload-artifact@v4
        with:
          name: sca.trivy.json
          path: sca-input/sca.trivy.json

  container-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t security-automation-assignment:ci .

      - name: Scan container image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/reports" \
            aquasec/trivy:0.74.0 image \
            --severity HIGH,CRITICAL \
            --format json \
            --output /reports/container.trivy.json \
            security-automation-assignment:ci

      - name: Check container for high or critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            security-automation-assignment:ci

      - name: Upload container scan report
        uses: actions/upload-artifact@v4
        with:
          name: container.trivy.json
          path: reports/container.trivy.json

  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan Terraform with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/workdir" \
            aquasec/trivy:0.74.0 config \
            --format json \
            --output /workdir/reports/iac.trivy.json \
            /workdir/terraform

      - name: Check Terraform for high or critical findings
        run: |
          docker run --rm \
            -v "$PWD:/workdir" \
            aquasec/trivy:0.74.0 config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /workdir/terraform

      - name: Upload IaC scan report
        uses: actions/upload-artifact@v4
        with:
          name: iac.trivy.json
          path: reports/iac.trivy.json